
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food Safety Innovation AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  body { margin:0; overflow:hidden; }
  #message {
    position:fixed;
    bottom:9%;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(8,42,43,.85);
    padding:14px 22px;
    border-radius:12px;
    font:600 20px Arial,sans-serif;
    text-align:center;
    z-index:10;
    display:none;
    white-space:nowrap;
  }
</style>

<script>
AFRAME.registerComponent('bacteria-3d', {
  init: function() {
    const THREE = AFRAME.THREE;
    const group = new THREE.Group();
    const bacteria = [];

    const colors = [0x27c5a8, 0xe98a68, 0xa18ad8];

    for (let i = 0; i < 14; i++) {
      const cell = new THREE.Group();

      const mat = new THREE.MeshStandardMaterial({
        color: colors[i % colors.length],
        roughness: 0.35,
        metalness: 0.08
      });

      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.035, 0.11, 8, 12),
        mat
      );
      body.rotation.z = Math.PI / 2;
      cell.add(body);

      // Small surface projections
      for (let j = 0; j < 8; j++) {
        const angle = j * Math.PI / 4;
        const spike = new THREE.Mesh(
          new THREE.CylinderGeometry(0.003,0.006,0.04,6),
          mat
        );
        spike.position.set(
          Math.cos(angle)*0.035,
          Math.sin(angle)*0.035,
          0
        );
        spike.rotation.z = angle - Math.PI/2;
        cell.add(spike);
      }

      const x = (Math.random() - .5) * .8;
      const y = (Math.random() - .5) * .7;

      cell.position.set(x,y,0.16);
      cell.rotation.z = Math.random()*Math.PI;
      cell.scale.setScalar(0.85 + Math.random()*0.5);

      group.add(cell);
      bacteria.push({
        cell:cell,
        y:y,
        phase:Math.random()*6.28
      });
    }

    this.el.setObject3D('bacteria',group);
    this.bacteria = bacteria;
  },

  tick: function(time,delta) {
    const t=time/1000;
    this.bacteria.forEach(b=>{
      b.cell.position.y =
        b.y + Math.sin(t*1.8+b.phase)*0.025;
      b.cell.rotation.z += (delta || 0)*0.00025;
    });
  }
});

AFRAME.registerComponent('target-events', {
  init: function() {
    const message=document.getElementById('message');
    this.el.addEventListener('targetFound',()=>{
      message.style.display='block';
    });
    this.el.addEventListener('targetLost',()=>{
      message.style.display='none';
    });
  }
});
</script>
</head>

<body>

<div id="message">Invisible risks!</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets></a-assets>

  <a-camera position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    mindar-image-target="targetIndex: 0"
    target-events>

    <a-entity bacteria-3d></a-entity>

  </a-entity>

  <a-entity light="type: ambient; intensity: 1.5"></a-entity>
  <a-entity light="type: directional; intensity: 2"
    position="1 2 3"></a-entity>

</a-scene>
</body>
</html>
