
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Safety Innovation AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    AFRAME.registerComponent('microbes', {
      init: function () {
        const THREE = AFRAME.THREE;
        const group = new THREE.Group();
        const cells = [];
        const colors = [0x16b8a6, 0xe48b65, 0x9382ce];

        for (let i = 0; i < 12; i++) {
          const bacterium = new THREE.Group();
          const material = new THREE.MeshStandardMaterial({
            color: colors[i % 3],
            roughness: 0.35,
            metalness: 0.05
          });

          // Rounded rod-shaped bacterium
          const geometry = new THREE.CapsuleGeometry(
            0.035, 0.11, 8, 16
          );
          const body = new THREE.Mesh(geometry, material);
          body.rotation.z = Math.PI / 2;
          bacterium.add(body);

          // Surface details
          const dotMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.45
          });

          for (let j = 0; j < 5; j++) {
            const dot = new THREE.Mesh(
              new THREE.SphereGeometry(0.009, 8, 8),
              dotMaterial
            );
            dot.position.set(
              (j - 2) * 0.025,
              0.029,
              0.012
            );
            bacterium.add(dot);
          }

          const x = (Math.random() - 0.5) * 0.8;
          const y = (Math.random() - 0.5) * 0.7;
          const z = 0.15 + Math.random() * 0.1;

          bacterium.position.set(x, y, z);
          bacterium.rotation.z = Math.random() * Math.PI;
          group.add(bacterium);

          cells.push({
            object: bacterium,
            baseY: y,
            phase: Math.random() * Math.PI * 2
          });
        }

        this.el.setObject3D('microbes', group);
        this.cells = cells;
      },

      tick: function (time) {
        const t = time / 1000;
        this.cells.forEach(cell => {
          cell.object.position.y =
            cell.baseY + Math.sin(t * 1.5 + cell.phase) * 0.025;
          cell.object.rotation.y += 0.005;
        });
      }
    });
  </script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-entity microbes></a-entity>

      <a-text
        value="What can't you see?"
        color="#FFFFFF"
        align="center"
        position="0 -0.55 0.1"
        width="1.8"
        side="double">
      </a-text>

    </a-entity>

  </a-scene>
</body>
</html>
