
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Safety Innovation AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  body { margin: 0; overflow: hidden; }

  #message {
    position: fixed;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(5, 45, 55, 0.9);
    color: white;
    padding: 14px 24px;
    border-radius: 12px;
    font: bold 22px Arial, sans-serif;
    white-space: nowrap;
    display: none;
    z-index: 10;
  }
</style>

<script>
AFRAME.registerComponent('microbe-overlay', {
  init: function () {
    const positions = [
      [-0.25, 0.20, 0.17, 0.32, -20],
      [ 0.22, 0.25, 0.19, 0.26,  30],
      [-0.12,-0.12, 0.21, 0.35,  15],
      [ 0.28,-0.18, 0.18, 0.29, -35],
      [ 0.02, 0.04, 0.23, 0.25,  50],
      [-0.32,-0.28, 0.20, 0.23, -10]
    ];

    positions.forEach((p, i) => {
      const entity = document.createElement('a-image');

      entity.setAttribute('src', '#bacteria-img');
      entity.setAttribute('transparent', 'true');
      entity.setAttribute('alpha-test', '0.05');
      entity.setAttribute('side', 'double');

      entity.setAttribute('position',
        `${p[0]} ${p[1]} ${p[2]}`);

      entity.setAttribute('width', p[3]);
      entity.setAttribute('height', p[3] * 0.56);
      entity.setAttribute('rotation', `0 0 ${p[4]}`);

      entity.setAttribute('animation__float', {
        property: 'position',
        to: `${p[0]} ${p[1] + 0.035} ${p[2]}`,
        dur: 1600 + i * 230,
        dir: 'alternate',
        loop: true,
        easing: 'easeInOutSine'
      });

      this.el.appendChild(entity);
    });
  }
});

AFRAME.registerComponent('target-events', {
  init: function () {
    const message = document.getElementById('message');

    this.el.addEventListener('targetFound', () => {
      message.style.display = 'block';
    });

    this.el.addEventListener('targetLost', () => {
      message.style.display = 'none';
    });
  }
});
</script>
</head>

<body>

<div id="message">Invisible risks!</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="bacteria-img" src="./bacteria.png">
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    mindar-image-target="targetIndex: 0"
    target-events>

    <a-entity microbe-overlay></a-entity>

  </a-entity>

</a-scene>
</body>
</html>
